name: Kittygram Plus CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'gateway/**'
      - 'docker-compose*.yml'
      - '.github/workflows/main.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'gateway/**'
      - 'docker-compose*.yml'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kittygram_test
          POSTGRES_USER: kittygram
          POSTGRES_PASSWORD: kittygram_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kittygram -d kittygram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Django system checks
        working-directory: backend
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          POSTGRES_DB: kittygram_test
          POSTGRES_USER: kittygram
          POSTGRES_PASSWORD: kittygram_password
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          POSTGRES_DB: kittygram_test
          POSTGRES_USER: kittygram
          POSTGRES_PASSWORD: kittygram_password
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
        run: python manage.py test cats collaborations

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: kittygram-plus-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: kittygram-plus-frontend:ci

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          push: false
          tags: kittygram-plus-gateway:ci

  publish:
    name: Publish production images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_plus_backend:latest

      - name: Publish frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_plus_frontend:latest

      - name: Publish gateway
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_plus_gateway:latest

  deploy:
    name: Deploy Kittygram Plus
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: DOCKER_USERNAME
          script: |
            set -eu
            app_dir="$HOME/kittygram-plus"
            if [ ! -d "$app_dir/.git" ]; then
              git clone --depth 1 https://github.com/AevoVex/kittygram-plus.git "$app_dir"
            else
              git -C "$app_dir" pull --ff-only origin main
            fi
            cd "$app_dir"

            if [ ! -f .env ]; then
              umask 077
              db_password="$(openssl rand -hex 24)"
              django_secret="$(openssl rand -hex 32)"
              printf '%s\n' \
                'DJANGO_DEBUG=0' \
                "DJANGO_SECRET_KEY=$django_secret" \
                'DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1' \
                'POSTGRES_DB=kittygram' \
                'POSTGRES_USER=kittygram' \
                "POSTGRES_PASSWORD=$db_password" \
                "DOCKER_USERNAME=$DOCKER_USERNAME" > .env
            fi

            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d --force-recreate
