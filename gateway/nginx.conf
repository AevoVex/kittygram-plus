server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://backend:8000/api/;
    }

    location /auth/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://backend:8000/auth/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://backend:8000/admin/;
    }

    location /media/ {
        alias /media/;
    }

    # Django collectstatic and drf-spectacular sidecar files live directly in
    # the shared static volume. They must not fall through to React's SPA
    # fallback, otherwise Swagger receives index.html in place of JavaScript.
    location /static/ {
        alias /staticfiles/;
        try_files $uri =404;
    }

    location / {
        alias /staticfiles/;
        index index.html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
